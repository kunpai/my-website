name: Publish Template

# Exports the site code + examples/ (never content/ or personal media) and pushes it to the
# public template repository. Needs:
#   - repository variable TEMPLATE_REPO (default: kunpai/academic-site-template)
#   - secret TEMPLATE_REPO_TOKEN: fine-grained PAT with "Contents: read and write" on that repo only

on:
  push:
    branches:
      - main
    paths:
      - 'components/**'
      - 'pages/**'
      - 'lib/**'
      - 'styles/**'
      - 'scripts/**'
      - 'examples/**'
      - 'schemas/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '*.config.js'
      - 'middleware.js'
      - 'jsconfig.json'
      - 'README.md'
      - 'LICENSE'
      - '.vscode/**'
      - '.github/workflows/build-resume.yml'
      - '.github/workflows/publish-template.yml'
  workflow_dispatch:

concurrency:
  group: publish-template
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TEMPLATE_REPO: ${{ vars.TEMPLATE_REPO || 'kunpai/academic-site-template' }}
      HAS_TOKEN: ${{ secrets.TEMPLATE_REPO_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Export template
        run: node scripts/export-template.js --out "$RUNNER_TEMP/template"

      # Build what a new user gets: a fresh copy, set up with the example content.
      - name: Smoke-test the template
        run: |
          cp -R "$RUNNER_TEMP/template" "$RUNNER_TEMP/template-test"
          cd "$RUNNER_TEMP/template-test"
          npm ci
          npm run setup -- --defaults
          npm run build

      - name: Skip publishing (no token configured)
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::TEMPLATE_REPO_TOKEN is not set; the template was exported and tested but not published."

      - name: Push to the template repository
        if: env.HAS_TOKEN == 'true'
        env:
          TOKEN: ${{ secrets.TEMPLATE_REPO_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${TEMPLATE_REPO}.git" "$RUNNER_TEMP/dest"
          cd "$RUNNER_TEMP/dest"
          # A freshly created (empty) repository has no branch yet.
          git rev-parse --verify HEAD >/dev/null 2>&1 || git checkout -b main
          # Replace everything except the git metadata with the fresh export.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$RUNNER_TEMP/template/." .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Template already up to date."
          else
            git commit -m "Sync from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
            git push origin HEAD:main
          fi
