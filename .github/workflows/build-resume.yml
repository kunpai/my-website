name: Build and Update Resumes & LLM Docs

on:
  push:
    branches:
      - main
    paths:
      - 'public/jsons/**'
      - 'scripts/**'
      - 'website.config.json'
  workflow_dispatch:

jobs:
  build-resumes:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-fonts-extra

      - name: Run Resume Generator and Compiler
        run: |
          chmod +x scripts/generate_resumes.py
          python3 scripts/generate_resumes.py

      - name: Run LLM Docs Generator
        run: |
          node scripts/generate_llms_txt.js

      - name: Commit and Push Compiled Resumes & LLM Docs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Stage the compiled PDFs, TeX sources, and generated LLM text files
          git add public/*.pdf public/latex_src/*.tex public/llms.txt public/llms-full.txt public/index.md
          
          # Commit only if there are modifications
          if ! git diff --cached --exit-code; then
            git commit -m "chore: auto-regenerate resumes and LLM docs from JSON sources [skip ci]"
            git push
          else
            echo "No changes to the compiled resumes or LLM docs."
          fi
